name: Image

# Builds the pk CLI image. Pull requests only build; pushes to main and
# sandboxv3/main, v* tags and manual runs push.
on:
  pull_request:
  push:
    branches: [main, sandboxv3/main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: europe-west3-docker.pkg.dev/prokube-internal/prokube-customer/prokube-cli

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=main-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sandboxv3-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/sandboxv3/main' }}
            type=sha,prefix=manual-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
