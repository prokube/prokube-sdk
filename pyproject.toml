[project]
name = "prokube-sdk"
version = "0.4.0.dev0"
description = "Python SDK for prokube.ai platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prokube.ai" }]
keywords = ["prokube", "sandbox", "ai", "coding", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.0.0; python_version < '3.11'",
    "ate-env-client @ git+https://github.com/agent-substrate/env@1c08a7a578afd896373511a83beb242aec1425c0#subdirectory=clients/python",
    "grpcio>=1.84.0,<2",
    "authlib>=1.6.6,<1.7",
    "PyJWT[crypto]>=2.10.1,<3",
    "keyring>=25,<26",
    "filelock>=3.16,<4",
    "websockets>=15,<16",
]

[project.scripts]
pk = "prokube.personal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pyright>=1.1.400",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/prokube/prokube-sdk"
Repository = "https://github.com/prokube/prokube-sdk"
Issues = "https://github.com/prokube/prokube-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prokube"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["prokube"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
# pyright's own default; pinned so a future default change cannot move the gate.
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
